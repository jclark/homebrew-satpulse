name: brew test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # setup-homebrew taps and trusts this repo automatically (it detects the
      # tap from the checkout); a manual `brew tap` would clash with it.
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew test-bot --only-tap-syntax

  test:
    # Apple Silicon only; the project does not test or ship for Intel macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # setup-homebrew taps and trusts this repo automatically.
      - uses: Homebrew/actions/setup-homebrew@main
      # satpulse (HEAD channel). `brew test` runs the smoke tests defined in the
      # formula's test block (hardware-free: there is no serial device on a
      # runner). It invokes the binaries by their keg paths, so it does not care
      # whether the formula is linked.
      - run: brew install --HEAD --build-from-source jclark/satpulse/satpulse
      - run: brew test --verbose jclark/satpulse/satpulse
      # Prerelease channel. Unlink first: both formulae ship the same binaries, so
      # they cannot be linked at the same time.
      - run: brew unlink satpulse
      - run: brew install --build-from-source jclark/satpulse/satpulse-pre
      - run: brew test --verbose jclark/satpulse/satpulse-pre
